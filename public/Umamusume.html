<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umamusume Pretty Derby | High-End Clone</title>
    <style>
        /* --- HỆ THỐNG BIẾN SỐ (SYSTEM VARIABLES) --- */
        :root {
            --um-blue-dark: #2c67b2;
            --um-blue-light: #4a90e2;
            --um-pink: #ff69b4;
            --um-pink-dark: #e05297;
            --um-green: #32cd32;
            --um-yellow: #ffeb3b;
            --white: #ffffff;
            --text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            --skew-deg: -15deg;
            --transition-smooth: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* --- SETUP NỀN TẢNG --- */
        * { margin: 0; padding: 0; box-sizing: border-box; outline: none; }
        body {
            font-family: 'Hiragino Kaku Gothic Pro', 'Meiryo', sans-serif;
            background-color: #fdfdfd;
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* --- NAVIGATION BAR (XỊN XÒ) --- */
        .uma-header {
            position: fixed;
            top: 0; width: 100%; height: 70px;
            background: linear-gradient(135deg, var(--um-blue-dark) 0%, var(--um-blue-light) 100%);
            display: flex; align-items: center;
            z-index: 10000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .uma-nav {
            display: flex; width: 100%; height: 100%;
            align-items: center; justify-content: flex-end;
            padding-right: 0;
        }

        .nav-link {
            position: relative;
            height: 100%; padding: 0 25px;
            display: flex; align-items: center;
            color: var(--white);
            text-decoration: none;
            font-weight: 900; font-style: italic;
            font-size: 15px; letter-spacing: 1px;
            transition: var(--transition-smooth);
            border-left: 1px solid rgba(255,255,255,0.15);
            overflow: hidden;
        }

        .nav-link::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.1);
            transform: translateX(-100%) skewX(var(--skew-deg));
            transition: var(--transition-smooth);
        }

        .nav-link:hover::before { transform: translateX(0) skewX(var(--skew-deg)); }
        .nav-link:hover { color: var(--um-yellow); text-shadow: 0 0 10px rgba(255,235,59,0.5); }

        .btn-play-now {
            background: var(--um-pink);
            height: 100%; padding: 0 60px;
            display: flex; align-items: center;
            color: var(--white); font-weight: 900; font-size: 20px;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            cursor: pointer; position: relative;
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.2);
        }

        .btn-play-now:hover { background: var(--um-pink-dark); }

        /* --- HERO VISUAL & LOGO --- */
        .hero-banner {
            height: 100vh;
            background: url('https://umamusume.com/common/images/main_visual_pc.jpg') no-repeat center bottom/cover;
            position: relative;
            display: flex; align-items: center; justify-content: center;
        }

        .hero-logo-container {
            position: absolute; top: 120px; left: 60px;
            animation: logoEntrance 1.2s ease-out forwards;
        }

        @keyframes logoEntrance {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); filter: blur(0); }
        }

        /* --- NEWS SECTION (CHUẨN ẢNH e290be) --- */
        .news-wrapper {
            max-width: 1100px; margin: -80px auto 100px;
            background: var(--white); border-radius: 30px;
            padding: 40px; position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.12);
            border: 10px solid #ffeef2;
        }

        .news-label {
            background: var(--um-pink); color: white;
            padding: 12px 50px; font-size: 28px; font-weight: 900;
            font-style: italic; transform: skewX(-20deg);
            display: inline-block; margin-bottom: 30px;
            box-shadow: 5px 5px 0 var(--um-blue-dark);
        }

        .news-list { list-style: none; }
        .news-item {
            display: grid; grid-template-columns: 100px 180px 1fr 50px;
            align-items: center; padding: 20px 0;
            border-bottom: 1px solid #f0f0f0;
            transition: 0.3s;
        }
        .news-item:hover { transform: translateX(15px); background: #fff9fa; }

        .category-tag {
            background: #a3d133; color: white;
            padding: 4px 10px; border-radius: 5px;
            font-size: 12px; text-align: center; font-weight: bold;
        }

        .news-date { color: #888; font-weight: bold; font-family: monospace; }
        .news-title { font-weight: 600; color: #444; }

        /* --- GAMEPLAY PREVIEW (ẢNH e290fc) --- */
        .gameplay-section {
            padding: 100px 0; background: linear-gradient(180deg, #fff 0%, #e8f4ff 100%);
            text-align: center;
        }

        .gameplay-title {
            font-size: 50px; font-style: italic; font-weight: 900;
            color: var(--um-green); -webkit-text-stroke: 1.5px #fff;
            filter: drop-shadow(3px 3px 0px var(--um-blue-dark));
            margin-bottom: 50px;
        }

        .game-cards-container {
            display: flex; justify-content: center; gap: 40px;
        }

        .game-card {
            width: 280px; height: 500px; border-radius: 20px;
            background: #333; border: 8px solid #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            overflow: hidden; position: relative;
        }

        /* --- CHARACTERS BOX (ẢNH e293a5) --- */
        .character-section { padding: 80px 5%; background: #f0f0f0; }
        .char-grid-title { font-size: 40px; font-weight: 900; margin-bottom: 40px; font-style: italic; }

        .char-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .char-box {
            aspect-ratio: 1/1; background: #fff;
            border-bottom: 5px solid var(--um-pink);
            transition: var(--transition-smooth);
            cursor: pointer; position: relative;
            overflow: hidden;
        }

        .char-box:hover {
            transform: scale(1.05) translateY(-10px);
            box-shadow: 0 10px 25px rgba(255,105,180,0.4);
            z-index: 2;
        }

        /* --- DOWNLOAD FOOTER (ẢNH e29420) --- */
        .download-footer {
            background: #1a1a1a; padding: 100px 0;
            color: white; text-align: center;
        }

        .dl-icon-main { width: 80px; border-radius: 15px; margin-bottom: 20px; }
        .store-btns {
            display: flex; justify-content: center; gap: 20px; margin-top: 30px;
        }
        .store-btns img { height: 45px; cursor: pointer; transition: 0.2s; }
        .store-btns img:hover { filter: brightness(1.3); transform: translateY(-3px); }

    </style>
</head>
<body>

    <header class="uma-header">
        <nav class="uma-nav">
            <a href="" class="nav-link">TOP</a>
            <a href="" class="nav-link">NEWS</a>
            <a href="" class="nav-link">CHARACTERS</a>
            <a href="" class="nav-link">MEDIA</a>
            <a href="" class="nav-link">WEB STORE</a>
            <div class="btn-play-now">PLAY NOW!</div>
        </nav>
    </header>

    <section class="hero-banner">
        <div class="hero-logo-container">
            <img src="https://umamusume.com/common/images/logo.png" width="400" alt="Umamusume">
        </div>
    </section>

    <section class="news-wrapper">
        <div class="news-label">News</div>
        <ul class="news-list">
            <li class="news-item">
                <span class="category-tag">Game</span>
                <span class="news-date">2026/03/23 22:00</span>
                <span class="news-title">A Legend Race is here! Event "Legend Race" begins.</span>
                <span style="color:var(--um-pink)">>></span>
            </li>
            <li class="news-item">
                <span class="category-tag" style="background:#4a90e2">WebStore</span>
                <span class="news-date">2026/03/23 22:00</span>
                <span class="news-title">1st Anniversary Celebration Part 2 items available!</span>
                <span style="color:var(--um-pink)">>></span>
            </li>
            </ul>
    </section>

    <section class="gameplay-section">
        <h2 class="gameplay-title">Train your Umamusume!</h2>
        <div class="game-cards-container">
            <div class="game-card">
                <div style="background: url('https://umamusume.com/common/images/gameplay_01.jpg') center/cover; height:100%"></div>
            </div>
            <div class="game-card">
                <div style="background: url('https://umamusume.com/common/images/gameplay_02.jpg') center/cover; height:100%"></div>
            </div>
        </div>
    </section>

    <section class="character-section">
        <h2 class="char-grid-title">Characters</h2>
        <div class="char-grid">
            <div class="char-box" style="background:#ffbdca"></div>
            <div class="char-box" style="background:#c2e0ff"></div>
            <div class="char-box" style="background:#ffeaa7"></div>
            <div class="char-box" style="background:#fab1a0"></div>
            <div class="char-box" style="background:#55efc4"></div>
            <div class="char-box" style="background:#d63031"></div>
            <div class="char-box" style="background:#fdcb6e"></div>
            <div class="char-box" style="background:#00b894"></div>
            <div class="char-box" style="background:#a29bfe"></div>
            <div class="char-box" style="background:#e84393"></div>
        </div>
    </section>

    <footer class="download-footer">
        <img src="https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/91/3d/82/913d8272-3f1d-285b-6192-369408018e67/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-0-0-0-GLES2_U002c0-512MB-85-220-0-10.png/512x512bb.jpg" class="dl-icon-main">
        <h3>Download Umamusume</h3>
        <div class="store-btns">
            <img src="https://umamusume.com/common/images/btn_appstore.png">
            <img src="https://umamusume.com/common/images/btn_googleplay.png">
            <img src="https://umamusume.com/common/images/btn_steam.png">
        </div>
        <p style="margin-top: 50px; opacity: 0.5; font-size: 12px;">© Cygames, Inc.</p>
    </footer>

</body>
</html>
